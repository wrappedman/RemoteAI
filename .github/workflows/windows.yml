name: Windows build and verification
on:
  push:
    branches: ['arena/3ab7c5f0-remoteai']
    paths-ignore: ['run/**', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build RemoteDesk.sln -c Release
      - name: Core, protocol and real TLS integration tests
        shell: pwsh
        run: |
          foreach ($name in @('Core', 'Protocol', 'Security')) {
            $output = dotnet run --project "tests/RemoteDesk.$name.Tests" -c Release --no-build 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host "$_" }
            if ($code -ne 0) {
              $output | ForEach-Object { Write-Host "::error::$_" }
              exit $code
            }
          }
      - name: Publish Windows x64 executable
        run: dotnet publish src/RemoteDesk.Desktop -c Release -r win-x64 --self-contained false -o artifacts/run
      - name: WPF startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process "$pwd/artifacts/run/RemoteDesk.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "RemoteDesk exited during startup: $($p.ExitCode)" }
          if ($p.MainWindowHandle -eq 0) { Stop-Process $p.Id; throw 'No WPF window created' }
          Write-Host "PASS: WPF window opened: $($p.MainWindowTitle)"
          Stop-Process $p.Id
      - name: Render and verify actual WPF workspace
        shell: pwsh
        run: |
          $output = dotnet run --project tests/RemoteDesk.Desktop.Tests -c Release --no-build -- artifacts/run/RemoteDesk-workspace.png 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host "$_" }
          if ($code -ne 0) { $output | ForEach-Object { Write-Host "::error::$_" }; exit $code }
      - name: Publish self-contained portable package
        shell: pwsh
        run: |
          dotnet publish src/RemoteDesk.Desktop -c Release -r win-x64 --self-contained true -o artifacts/portable -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item run/README.md artifacts/run/README.md
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/run/RemoteDesk-win-x64-portable.zip -CompressionLevel Optimal
          Get-ChildItem artifacts/run -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content artifacts/run/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-win-x64
          path: artifacts/run/
          retention-days: 14
      - name: Save verified deliverables to the session branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/3ab7c5f0-remoteai'
        shell: pwsh
        run: |
          Copy-Item artifacts/run/* run/ -Force
          @"
          # Verified Windows build

          Source commit: ${{ github.sha }}
          Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Runner: windows-latest, Windows x64, .NET 10 SDK.
          Checks: Release solution build, Core/Protocol/Security integration suites, Windows CNG persistence and non-exportability, WPF window startup and rendered workspace/default-off state checks.
          Manual two-PC LAN, DPI and resource acceptance: pending (see docs/Acceptance.md).
          Package is unsigned. No screen streaming or remote input in phase one.
          "@ | Set-Content run/BUILD-INFO.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run
          git commit -m "Add verified Windows executables and portable package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/3ab7c5f0-remoteai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
